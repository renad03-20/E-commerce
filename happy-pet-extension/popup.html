<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Pet Importer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 250px;
      padding: 15px;
      text-align: center;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;

      width: 100%;

    }
    button:hover {

    }

      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <h3>Happy Pet Dropshipping</h3>
  <button id="import-btn">Import Product</button>
  <p id="status"></p>

</html>
